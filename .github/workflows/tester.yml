name: Agent — tester

# Writes failing tests from an issue's acceptance criteria (docs/agent-pipeline.md).
on:
  issues:
    types: [labeled]

permissions:
  contents: read

jobs:
  test:
    if: github.event.label.name == 'agent:ready'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency: task-${{ github.event.issue.number }}
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: katip
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:password@localhost:5432/katip
      NODE_ENV: test
    steps:
      - uses: actions/create-github-app-token@v1
        id: app
        with:
          app-id: ${{ vars.TESTER_APP_ID }}
          private-key: ${{ secrets.TESTER_APP_KEY }}
      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app.outputs.token }}
          fetch-depth: 0
      # claude-code-action sets the git identity itself from bot_id/bot_name
      # (default claude[bot]); pass the app bot so commits and test-guard agree.
      - name: Resolve the tester bot identity
        id: bot
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          id=$(gh api "/users/${SLUG}%5Bbot%5D" --jq .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "name=${SLUG}[bot]" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app.outputs.token }}
          bot_id: ${{ steps.bot.outputs.id }}
          bot_name: ${{ steps.bot.outputs.name }}
          prompt: |
            Your role and rules are in .github/claude/tester.md. Read it first.
            Repository: ${{ github.repository }}
            Issue: #${{ github.event.issue.number }}
          claude_args: >-
            --model claude-opus-5-5
            --max-turns 60
            --disallowedTools "Bash(git config:*),Bash(git -c:*)"
            --allowedTools "Read,Edit,Write,Grep,Glob,Bash(git:*),Bash(gh issue:*),Bash(npm test:*),Bash(npm run:*),Bash(npx vitest:*)"
      # Deterministic handoff: freeze the tests on the pushed SHA (a commit status
      # only the tester app can create), then start the implementer. The agent
      # itself never adds agent:tests-ready.
      - name: Freeze tests and hand off to the implementer
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          if gh issue view "$ISSUE" -R "$REPO" --json labels --jq '.labels[].name' | grep -qx 'needs-human'; then
            echo "Issue needs a human; no handoff."
            exit 0
          fi
          git fetch --quiet origin
          branch=$(git for-each-ref --format='%(refname:lstrip=3)' "refs/remotes/origin/task/${ISSUE}-*" | head -1)
          if [ -z "$branch" ]; then
            gh issue edit "$ISSUE" -R "$REPO" --add-label needs-human
            gh issue comment "$ISSUE" -R "$REPO" --body "Tester run ended without pushing a task/${ISSUE}-* branch. Needs a human."
            exit 1
          fi
          sha=$(git rev-parse "origin/$branch")
          if [ "$(git rev-list --count "origin/main..$sha")" -eq 0 ]; then
            gh issue edit "$ISSUE" -R "$REPO" --add-label needs-human
            gh issue comment "$ISSUE" -R "$REPO" --body "Branch $branch has no commits beyond main. Needs a human."
            exit 1
          fi
          gh api "repos/$REPO/statuses/$sha" \
            -f state=success -f context=tests-frozen \
            -f description="Tests handed off for #$ISSUE"
          gh issue edit "$ISSUE" -R "$REPO" --add-label agent:tests-ready
          echo "Froze tests at $sha on $branch."
