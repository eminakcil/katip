name: Agent — tester

# Writes failing tests from an issue's acceptance criteria (docs/agent-pipeline.md).
on:
  issues:
    types: [labeled]

permissions:
  contents: read

jobs:
  test:
    if: github.event.label.name == 'agent:ready'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency: task-${{ github.event.issue.number }}
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: katip
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:password@localhost:5432/katip
      NODE_ENV: test
    steps:
      - uses: actions/create-github-app-token@v1
        id: app
        with:
          app-id: ${{ vars.TESTER_APP_ID }}
          private-key: ${{ secrets.TESTER_APP_KEY }}
      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app.outputs.token }}
          fetch-depth: 0
      - name: Commit as the tester bot (test-guard checks the author)
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          id=$(gh api "/users/${SLUG}%5Bbot%5D" --jq .id)
          git config user.name "${SLUG}[bot]"
          git config user.email "${id}+${SLUG}[bot]@users.noreply.github.com"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app.outputs.token }}
          prompt: |
            Your role and rules are in .github/claude/tester.md. Read it first.
            Repository: ${{ github.repository }}
            Issue: #${{ github.event.issue.number }}
          claude_args: >-
            --model claude-opus-5-5
            --max-turns 60
            --allowedTools "Read,Edit,Write,Grep,Glob,Bash(git:*),Bash(gh issue:*),Bash(npm test:*),Bash(npm run:*),Bash(npx vitest:*)"
