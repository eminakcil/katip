name: Agent — reviewer

# Reviews the implementer's PR against the acceptance criteria and tests.
# Read-only: no Edit/Write tools, contents read-only app (docs/agent-pipeline.md).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  review:
    if: github.event.pull_request.user.login == 'eminakcil-implementer[bot]' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/create-github-app-token@v1
        id: app
        with:
          app-id: ${{ vars.REVIEWER_APP_ID }}
          private-key: ${{ secrets.REVIEWER_APP_KEY }}
      # claude-code-action sets the git identity itself from bot_id/bot_name
      # (default claude[bot]); pass the app bot so commits and test-guard agree.
      - name: Resolve the reviewer bot identity
        id: bot
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          id=$(gh api "/users/${SLUG}%5Bbot%5D" --jq .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "name=${SLUG}[bot]" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app.outputs.token }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app.outputs.token }}
          bot_id: ${{ steps.bot.outputs.id }}
          bot_name: ${{ steps.bot.outputs.name }}
          # Runs on PRs opened/updated by the implementer bot. Explicit list
          # only, never "*" (public repo).
          allowed_bots: "eminakcil-implementer"
          prompt: |
            Your role and rules are in .github/claude/reviewer.md. Read it first.
            Repository: ${{ github.repository }}
            PR: #${{ github.event.pull_request.number }}
            Base: ${{ github.event.pull_request.base.sha }}  Head: ${{ github.event.pull_request.head.sha }}
          claude_args: >-
            --model claude-opus-5-5
            --max-turns 40
            --allowedTools "Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr review:*),Bash(gh pr checks:*),Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh issue edit:*)"
